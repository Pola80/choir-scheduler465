services:
  - type: web
    name: choir-scheduler-api
    runtime: node
    buildCommand: npm ci && npm run build:api
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: choir-scheduler-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # Set this in Render dashboard to your Cloudflare Pages URL

databases:
  - name: choir-scheduler-db
    plan: free
    databaseName: choir_scheduler
    user: choir_scheduler
