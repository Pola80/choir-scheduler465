steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/choir-scheduler:latest'
      - '.'

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/choir-scheduler']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'choir-scheduler'
      - '--image=gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=choir-scheduler-465:us-central1:choir-scheduler-db'
      - '--set-env-vars=NODE_ENV=production,DATABASE_URL=postgresql://choir_user:KN0PuyVbqTMlbHwphyM1@/choir_scheduler?host=/cloudsql/choir-scheduler-465:us-central1:choir-scheduler-db,JWT_SECRET=$_JWT_SECRET'

images:
  - 'gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/choir-scheduler:latest'

options:
  logging: CLOUD_LOGGING_ONLY
