steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/choir-scheduler:latest'
      - '.'

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/choir-scheduler']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'choir-scheduler'
      - '--image=gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/choir-scheduler:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/choir-scheduler:latest'

options:
  logging: CLOUD_LOGGING_ONLY
